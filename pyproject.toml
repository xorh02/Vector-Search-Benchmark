[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "vector-search-bench"
dynamic = ["version"]
description = "Reproducible benchmark of exact vs HNSW nearest-neighbour search in PostgreSQL pgvector"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "xorh02" }]
keywords = ["pgvector", "postgresql", "hnsw", "benchmark", "vector-search", "ann"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: System :: Benchmark",
]
dependencies = [
    "numpy>=1.26",
    "psycopg[binary]>=3.1",
    "pydantic>=2.6",
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "build>=1.2"]

[project.scripts]
vsbench = "vsbench.cli:app"

[project.urls]
Repository = "https://github.com/xorh02/Vector-Search-Benchmark"

[tool.hatch.version]
path = "src/vsbench/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/vsbench"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a PostgreSQL server with pgvector (set VSBENCH_DATABASE_URL)"]
