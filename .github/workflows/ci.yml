name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: vsbench
          POSTGRES_PASSWORD: vsbench
          POSTGRES_DB: vsbench
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U vsbench" --health-interval 2s
          --health-timeout 5s --health-retries 30
    env:
      VSBENCH_DATABASE_URL: postgresql://vsbench:vsbench@127.0.0.1:5433/vsbench
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Unit and PostgreSQL integration tests
        run: pytest -v

  package:
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: vsbench
          POSTGRES_PASSWORD: vsbench
          POSTGRES_DB: vsbench
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U vsbench" --health-interval 2s
          --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: pip install build && python -m build
      - name: Install wheel into a clean virtualenv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
      - name: Installed CLI smoke test
        working-directory: /tmp
        run: |
          /tmp/clean/bin/vsbench --help
          /tmp/clean/bin/vsbench check
          /tmp/clean/bin/vsbench init smoke.toml
          sed -i 's/^size = 20000/size = 2000/; s/^queries = 200/queries = 20/' smoke.toml
          /tmp/clean/bin/vsbench run smoke.toml --out smoke
          test -s smoke/report.html && test -s smoke/results.csv
          /tmp/clean/bin/vsbench report smoke/results.json --out smoke2
          test -s smoke2/report.html
      - name: External consumer example (installed wheel, outside the repo)
        working-directory: /tmp
        run: |
          cp "$GITHUB_WORKSPACE/examples/choose_ef_search.py" /tmp/
          /tmp/clean/bin/python -I choose_ef_search.py --size 5000 --target 0.9
